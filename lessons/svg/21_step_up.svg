<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Step-up: max_age=0 forces a fresh sign-in, whose auth_time must follow the step-up request, by the same iss and sub">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="800" height="420" fill="#fafaf9"/>
<text x="20" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">Step-up: a fresh sign-in, by the same user, for one action</text>
<rect x="40" y="104" width="340" height="32" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="380" y="104" width="290" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
<line x1="40" y1="120" x2="770" y2="120" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="772" y="140" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="end" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">time</tspan></text>
<circle cx="90" cy="120" r="5" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/>
<text x="90" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">alice signs in</text>
<text x="90" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">pwd, an hour earlier</tspan></text>
<circle cx="380" cy="120" r="5" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="380" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb">step-up starts</tspan></text>
<text x="380" y="88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">started_at</tspan></text>
<circle cx="500" cy="120" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="1.5"/>
<text x="500" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#16a34a">she signs in again</tspan></text>
<text x="500" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">pwd + otp, 20 s later</tspan></text>
<circle cx="640" cy="120" r="5" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/>
<text x="640" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve">app checks</text>
<text x="640" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">the ID token</tspan></text>
<text x="210" y="156" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">auth_time earlier: stale_auth_time</tspan></text>
<text x="525" y="156" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#16a34a">started_at - L &lt;= auth_time &lt;= now + L</tspan></text>
<rect x="20" y="180" width="370" height="100" rx="4" fill="#dbeafe" stroke="#6b7280" stroke-width="1"/>
<text x="28" y="198" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">app sends a login of its own:</text>
<text x="28" y="213" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">GET https://id.example/authorize?</text>
<text x="28" y="228" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">  acr_values=urn:toy:acr:mfa</text>
<text x="28" y="243" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">  <tspan fill="#dc2626">max_age=0</tspan>  (= prompt=login)</text>
<text x="28" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">  id_token_hint=&lt;alice's ID token&gt;</text>
<text x="28" y="273" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">  new <tspan fill="#2563eb">state</tspan>, <tspan fill="#7c3aed">nonce</tspan>, <tspan fill="#ea580c">code_challenge</tspan></text>
<rect x="410" y="180" width="370" height="100" rx="4" fill="#dcfce7" stroke="#6b7280" stroke-width="1"/>
<text x="418" y="198" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">app checks the step-up's ID token:</text>
<text x="418" y="213" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">1 <tspan fill="#2563eb">iss</tspan> and <tspan fill="#2563eb">sub</tspan> = the session's user</text>
<text x="418" y="228" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">  (https://id.example, alice), no other</tspan></text>
<text x="418" y="243" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">2 <tspan fill="#7c3aed">nonce</tspan> = this step-up's own</text>
<text x="418" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">3 <tspan fill="#16a34a">auth_time</tspan> in the green window</text>
<text x="418" y="273" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">4 acr in {urn:toy:acr:mfa}, from the token</text>
<text x="20" y="314" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">max_age=0 makes id.example sign alice in again: Core says it "is equivalent to prompt=login".</text>
<text x="20" y="334" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">auth_time is compared with started_at, not with now: with max_age=0, now - auth_time &lt;= max_age</text>
<text x="20" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">fails as soon as the clock moves past the leeway.</text>
<text x="20" y="374" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">The same user means the same iss and sub together (Core §5.7). That check is the app's; RFC 9470</text>
<text x="20" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">does not make it. Passing all four buys a grant for one action, one user, one session, spent once.</text>
<text x="20" y="410" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">Refused: an answer from the old session, another tab's login, or alice at https://other-id.example.</tspan></text>
</svg>
