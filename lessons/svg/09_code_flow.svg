<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720" role="img" aria-label="The authorization code flow, showing where state, nonce, the PKCE verifier and challenge travel">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="800" height="720" fill="#fafaf9"/>
<rect x="15" y="30" width="190" height="44" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="110" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">alice's browser</text>
<text x="110" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">user agent</tspan></text>
<line x1="110" y1="74" x2="110" y2="660" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="305" y="30" width="190" height="44" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="400" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">https://app.example</text>
<text x="400" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">client, client_id=app</tspan></text>
<line x1="400" y1="74" x2="400" y2="660" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="595" y="30" width="190" height="44" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="690" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">https://id.example</text>
<text x="690" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">OpenID Provider</tspan></text>
<line x1="690" y1="74" x2="690" y2="660" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="114" y1="104" x2="396" y2="104" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="255" y="98" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">GET /login</text>
<rect x="220" y="116" width="360" height="55" rx="4" fill="#fef3c7" stroke="#6b7280" stroke-width="1"/>
<text x="228" y="134" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">app makes a pending login and keeps it:</text>
<text x="228" y="149" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#2563eb">state</tspan>, <tspan fill="#7c3aed">nonce</tspan>, <tspan fill="#ea580c">code_verifier</tspan></text>
<text x="228" y="164" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#ea580c">code_challenge</tspan> = BASE64URL(SHA256(code_verifier))</text>
<line x1="396" y1="196" x2="114" y2="196" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="255" y="190" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">303  Set-Cookie: oidc_state=<tspan fill="#2563eb">state</tspan></text>
<text x="400" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">GET /authorize?response_type=code&amp;scope=openid</text>
<text x="400" y="236" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">&amp;client_id=app&amp;redirect_uri=https://app.example/callback</text>
<line x1="114" y1="258" x2="686" y2="258" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="400" y="252" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">&amp;<tspan fill="#2563eb">state</tspan>&amp;<tspan fill="#7c3aed">nonce</tspan>&amp;<tspan fill="#ea580c">code_challenge</tspan>&amp;code_challenge_method=S256</text>
<rect x="440" y="272" width="350" height="40" rx="4" fill="#fef3c7" stroke="#6b7280" stroke-width="1"/>
<text x="448" y="290" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">alice signs in; the code remembers</text>
<text x="448" y="305" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#7c3aed">nonce</tspan>, <tspan fill="#ea580c">code_challenge</tspan>, client_id, redirect_uri</text>
<line x1="686" y1="340" x2="114" y2="340" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="400" y="334" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">303 to redirect_uri?<tspan fill="#16a34a">code</tspan>&amp;<tspan fill="#2563eb">state</tspan>&amp;iss</text>
<text x="255" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">GET /callback?<tspan fill="#16a34a">code</tspan>&amp;<tspan fill="#2563eb">state</tspan>&amp;iss</text>
<line x1="114" y1="386" x2="396" y2="386" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="255" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">Cookie: oidc_state=<tspan fill="#2563eb">state</tspan></text>
<rect x="220" y="398" width="360" height="55" rx="4" fill="#fef3c7" stroke="#6b7280" stroke-width="1"/>
<text x="228" y="416" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">the returned <tspan fill="#2563eb">state</tspan> is a pending login's,</text>
<text x="228" y="431" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">bound to this browser by its cookie;</text>
<text x="228" y="446" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">iss is https://id.example</text>
<text x="545" y="462" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">POST /token</text>
<line x1="404" y1="482" x2="686" y2="482" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="545" y="476" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#16a34a">code</tspan> redirect_uri <tspan fill="#ea580c">code_verifier</tspan></text>
<text x="545" y="498" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">back channel: no browser</tspan></text>
<rect x="440" y="508" width="350" height="55" rx="4" fill="#fef3c7" stroke="#6b7280" stroke-width="1"/>
<text x="448" y="526" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">code unused, for app, unexpired,</text>
<text x="448" y="541" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">same redirect_uri, then</text>
<text x="448" y="556" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">S256(<tspan fill="#ea580c">code_verifier</tspan>) == <tspan fill="#ea580c">code_challenge</tspan></text>
<text x="545" y="582" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">200  Cache-Control: no-store</text>
<line x1="686" y1="602" x2="404" y2="602" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="545" y="596" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">id_token{<tspan fill="#7c3aed">nonce</tspan>} access_token</text>
<rect x="220" y="614" width="360" height="40" rx="4" fill="#fef3c7" stroke="#6b7280" stroke-width="1"/>
<text x="228" y="632" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">validate the ID token; its <tspan fill="#7c3aed">nonce</tspan></text>
<text x="228" y="647" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">must equal the pending login's <tspan fill="#7c3aed">nonce</tspan></text>
<text x="400" y="688" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#2563eb">state</tspan> ties the callback to this browser.   <tspan fill="#7c3aed">nonce</tspan> ties the ID token to this login.</text>
<text x="400" y="708" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#ea580c">PKCE</tspan>: only the client that holds <tspan fill="#ea580c">code_verifier</tspan> can redeem the code.</text>
</svg>
