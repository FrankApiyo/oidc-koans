<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 594" width="780" height="594" role="img" aria-label="The ID token checks in the order toy/client.py runs them, each with every reason it raises">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="780" height="594" fill="#fafaf9"/>
<text x="20" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">validate_id_token, in this course's order</text>
<text x="20" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">check</tspan></text>
<text x="450" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">InvalidToken reasons</tspan></text>
<rect x="20" y="66" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="83" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 1</tspan></text>
<text x="52" y="83" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">three base64url segments; header and payload JSON objects</text>
<text x="450" y="83" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">malformed</tspan></text>
<rect x="20" y="96" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="113" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 2</tspan></text>
<text x="52" y="113" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">typ absent, JWT or application/jwt; no events claim</text>
<text x="450" y="113" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">wrong_typ</tspan></text>
<rect x="20" y="126" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="143" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 3</tspan></text>
<text x="52" y="143" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">alg is one you allow (RS256, ES256 here)</text>
<text x="450" y="143" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">alg_not_allowed</tspan></text>
<rect x="20" y="156" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="173" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 4</tspan></text>
<text x="52" y="173" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">kid names a key in the issuer's JWKS, of the alg's kty</text>
<text x="450" y="173" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">unknown_kid, alg_not_allowed</tspan></text>
<rect x="20" y="186" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="203" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 5</tspan></text>
<text x="52" y="203" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">that key is a usable JWK, and the signature verifies</text>
<text x="450" y="203" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">malformed, bad_signature</tspan></text>
<rect x="20" y="216" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="233" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 6</tspan></text>
<text x="52" y="233" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">sub is a non-empty string</text>
<text x="450" y="233" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">malformed</tspan></text>
<rect x="20" y="246" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="263" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 7</tspan></text>
<text x="52" y="263" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">iss equals the issuer, exactly</text>
<text x="450" y="263" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">wrong_issuer</tspan></text>
<rect x="20" y="276" width="420" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="293" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 8</tspan></text>
<text x="52" y="293" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">aud: a string or array; lists client_id; others trusted</text>
<text x="450" y="293" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">malformed, wrong_audience</tspan></text>
<rect x="20" y="306" width="420" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text x="34" y="323" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb"> 9</tspan></text>
<text x="52" y="323" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">azp equals client_id, and is present when aud has</text>
<text x="52" y="339" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">several (both only under the azp extension)</text>
<text x="450" y="323" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">azp_mismatch</tspan></text>
<rect x="20" y="352" width="420" height="40" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="34" y="369" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#7c3aed">10</tspan></text>
<text x="52" y="369" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">exp and iat present, numeric: iat - L &lt;= now &lt; exp + L</text>
<text x="52" y="385" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">nbf, when present: nbf - L &lt;= now</text>
<text x="450" y="369" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">malformed, expired,</tspan></text>
<text x="450" y="385" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">issued_in_future, not_yet_valid</tspan></text>
<rect x="20" y="398" width="420" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="34" y="415" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#7c3aed">11</tspan></text>
<text x="52" y="415" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">nonce equals the one sent, or neither has one</text>
<text x="450" y="415" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">nonce_mismatch</tspan></text>
<rect x="20" y="428" width="420" height="56" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="34" y="445" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#7c3aed">12</tspan></text>
<text x="52" y="445" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">auth_time: needed with max_age or a login start; a number;</text>
<text x="52" y="461" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">auth_time &lt;= now + L; now - auth_time &lt;= max_age + L;</text>
<text x="52" y="477" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">auth_time &gt;= the time the login started, when given</text>
<text x="450" y="445" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">auth_time_missing, malformed,</tspan></text>
<text x="450" y="461" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">issued_in_future, stale_auth_time</tspan></text>
<rect x="20" y="490" width="420" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="34" y="507" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#7c3aed">13</tspan></text>
<text x="52" y="507" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">acr is in the set you accept, when you ask</text>
<text x="450" y="507" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">acr_not_met</tspan></text>
<text x="450" y="26" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve"><tspan fill="#2563eb">chapter 11</tspan>   <tspan fill="#7c3aed">chapter 12</tspan></text>
<text x="20" y="538" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">L is the leeway, 0 unless stated. The first failing check names the reason,</tspan></text>
<text x="20" y="556" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">so a token with two defects always gets the same one. Checks 1, 3, 4 and 5 are</tspan></text>
<text x="20" y="574" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">jws_split and jws_verify; sub comes before iss.</tspan></text>
</svg>
