<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" role="img" aria-label="The four OAuth roles, and the two tokens: the ID token for the client, the access token for an API">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="780" height="360" fill="#fafaf9"/>
<rect x="20" y="140" width="170" height="64" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="105" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">alice</text>
<text x="105" y="184" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">resource owner, in her browser</tspan></text>
<rect x="290" y="30" width="210" height="64" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="395" y="58" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">https://id.example</text>
<text x="395" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">authorization server = OpenID Provider</tspan></text>
<rect x="290" y="250" width="210" height="64" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="395" y="278" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">https://app.example</text>
<text x="395" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">client = Relying Party</tspan></text>
<rect x="590" y="250" width="170" height="64" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="675" y="278" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">an API</text>
<text x="675" y="294" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">resource server; UserInfo is one</tspan></text>
<line x1="150" y1="138" x2="286" y2="72" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="200" y="84" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#2563eb">1  she signs in at id.example</tspan></text>
<text x="200" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="end" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">never at the client</tspan></text>
<line x1="150" y1="206" x2="286" y2="274" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="228" y="268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="end" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#2563eb">2  back with a one-time code</tspan></text>
<line x1="395" y1="248" x2="395" y2="98" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<text x="405" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#ea580c">3  code in, tokens out</tspan></text>
<text x="405" y="176" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">client to server, no browser</tspan></text>
<line x1="502" y1="282" x2="586" y2="282" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="545" y="274" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#16a34a">4  Bearer</tspan></text>
<text x="545" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">access token</tspan></text>
<text x="525" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold" xml:space="preserve">OIDC = OAuth 2.0 + scope=openid</text>
<text x="525" y="70" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">ID token: a signed JWT to the client</text>
<text x="525" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">about who signed in. aud = the client.</text>
<text x="525" y="112" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">Access token: for an API to accept.</text>
<text x="525" y="128" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">Opaque to the client; not a login.</text>
<text x="390" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">Blue goes through the browser (front channel). Orange and green go from the client straight to a server.</tspan></text>
</svg>
