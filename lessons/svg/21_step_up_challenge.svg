<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="An API answers 401 with an RFC 9470 WWW-Authenticate challenge, and the client asks for that sign-in">
<defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<rect width="800" height="600" fill="#fafaf9"/>
<rect x="25" y="30" width="190" height="44" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="120" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">https://app.example</text>
<text x="120" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">client</tspan></text>
<line x1="120" y1="74" x2="120" y2="530" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="325" y="30" width="190" height="44" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="420" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">https://api.example</text>
<text x="420" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">resource server</tspan></text>
<line x1="420" y1="74" x2="420" y2="530" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="595" y="30" width="190" height="44" rx="4" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.5"/>
<text x="690" y="48" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">https://id.example</text>
<text x="690" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">OpenID Provider</tspan></text>
<line x1="690" y1="74" x2="690" y2="530" stroke="#6b7280" stroke-width="1" stroke-dasharray="5 4"/>
<text x="270" y="104" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">GET /statement</text>
<line x1="124" y1="124" x2="416" y2="124" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="270" y="118" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">Authorization: Bearer &lt;access token&gt;</text>
<rect x="290" y="136" width="490" height="55" rx="4" fill="#fef3c7" stroke="#6b7280" stroke-width="1"/>
<text x="298" y="154" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">checks the token first (introspection): active?</text>
<text x="298" y="169" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">then acr in {urn:toy:acr:mfa}? signed in within 60 s?</text>
<text x="298" y="184" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">alice's token: acr urn:toy:acr:pwd, from 120 s ago</tspan></text>
<line x1="416" y1="218" x2="124" y2="218" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="270" y="212" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#dc2626">401 Unauthorized</tspan></text>
<rect x="20" y="230" width="760" height="55" rx="4" fill="#ffedd5" stroke="#6b7280" stroke-width="1"/>
<text x="28" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">WWW-Authenticate: Bearer error=<tspan fill="#dc2626">"insufficient_user_authentication"</tspan>,</text>
<text x="28" y="263" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">  error_description="A different authentication level is required",</text>
<text x="28" y="278" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">  acr_values=<tspan fill="#2563eb">"urn:toy:acr:mfa"</tspan>, max_age=<tspan fill="#2563eb">"60"</tspan></text>
<text x="24" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">one header line, folded here as RFC 9470 folds its examples</tspan></text>
<rect x="20" y="314" width="380" height="40" rx="4" fill="#fef3c7" stroke="#6b7280" stroke-width="1"/>
<text x="28" y="332" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">parse_challenge reads acr_values</text>
<text x="28" y="347" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">and max_age, a non-negative int</text>
<line x1="124" y1="392" x2="686" y2="392" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="405" y="386" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">/authorize?…&amp;acr_values=urn:toy:acr:mfa&amp;max_age=60</text>
<text x="405" y="408" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#6b7280">through alice's browser, with a new state, nonce and code_challenge</tspan></text>
<line x1="686" y1="446" x2="124" y2="446" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="405" y="440" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">tokens: acr urn:toy:acr:mfa, a fresh auth_time</text>
<line x1="124" y1="486" x2="416" y2="486" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<text x="270" y="480" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve">GET /statement  Bearer &lt;new token&gt;</text>
<line x1="416" y1="516" x2="124" y2="516" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="270" y="510" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="#1f2937" font-weight="normal" xml:space="preserve"><tspan fill="#16a34a">200 OK</tspan></text>
<text x="20" y="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">A token that is not active gets only error="invalid_token", with no acr_values or max_age:</text>
<text x="20" y="578" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="normal" xml:space="preserve">a challenge sent before checking the token "will leak the required properties" (RFC 9470 §9).</text>
</svg>
