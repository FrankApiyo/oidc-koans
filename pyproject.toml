[project]
name = "oidc-koans"
version = "0.1.0"
description = "Koans for OpenID Connect, built offline on a toy provider"
requires-python = ">=3.13"
dependencies = ["pytest>=8", "cryptography>=49,<51"]

[tool.pytest.ini_options]
addopts = "-x -q --no-header -p no:cacheprovider --import-mode=importlib"
testpaths = ["koans"]
python_files = ["*_test.py", "test_*.py"]
pythonpath = ["."]
