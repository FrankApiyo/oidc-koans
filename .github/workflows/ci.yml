name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes no major-version tag, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -r pyproject.toml
      - name: Self-tests
        run: |
          source .venv/bin/activate
          pytest tests/
